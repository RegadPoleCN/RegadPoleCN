# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (each day)
  schedule: [{cron: "0 0 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    name: Update metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: basic
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          filename: github-basic.svg
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Shanghai
          repositories_forks: yes
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_repositories: yes
          plugin_repositories_featured: PlumBot, fursuit-tv-sdk
          plugin_repositories_order: featured, pinned, starred, random
      - name: other
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-other.svg
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following
          plugin_fortune: yes
          plugin_pagespeed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_url: https://regadpole.top
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_achievements_limit: 2
          plugin_steam_games_limit: 1
          plugin_steam_playtime_threshold: 2
          plugin_steam_recent_games_limit: 1
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_user: "76561199035455932"

      - name: Pull latest changes
        run: |
          git pull origin main

      - name: Merge SVGs into desktop & mobile banners
        run: |
          python3 << 'EOF'
          import re

          def load(path):
              with open(path, "r", encoding="utf-8") as f:
                  return f.read()

          def clean(svg):
              """去掉 xml 声明和 DOCTYPE，保留完整 <svg>...</svg>"""
              svg = re.sub(r'<\?xml[^>]*\?>', '', svg)
              svg = re.sub(r'<!DOCTYPE[^>]*>', '', svg)
              return svg.strip()

          def get_viewbox(svg):
              """提取 viewBox 宽高；没有就退回 width/height；再没有就给默认值"""
              m = re.search(r'viewBox="([\d\.\-\s]+)"', svg)
              if m:
                  parts = m.group(1).split()
                  if len(parts) == 4:
                      return float(parts[2]), float(parts[3])
              w = re.search(r'width="([\d\.]+)"', svg)
              h = re.search(r'height="([\d\.]+)"', svg)
              return (float(w.group(1)) if w else 500,
                      float(h.group(1)) if h else 300)

          basic_raw = load("github-basic.svg")
          other_raw = load("github-other.svg")

          basic = clean(basic_raw)
          other = clean(other_raw)

          bw, bh = get_viewbox(basic_raw)
          ow, oh = get_viewbox(other_raw)

          GAP = 20

          # ---- 桌面：横向并排 ----
          desktop_w = bw + ow + GAP
          desktop_h = max(bh, oh)
          desktop = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {desktop_w} {desktop_h}" width="{desktop_w}" height="{desktop_h}">
          <svg x="0" y="0" width="{bw}" height="{bh}" viewBox="0 0 {bw} {bh}">{basic}</svg>
          <svg x="{bw + GAP}" y="0" width="{ow}" height="{oh}" viewBox="0 0 {ow} {oh}">{other}</svg>
          </svg>'''

          # ---- 移动：纵向堆叠 ----
          mobile_w = max(bw, ow)
          mobile_h = bh + oh + GAP
          mobile = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {mobile_w} {mobile_h}" width="{mobile_w}" height="{mobile_h}">
          <svg x="0" y="0" width="{bw}" height="{bh}" viewBox="0 0 {bw} {bh}">{basic}</svg>
          <svg x="0" y="{bh + GAP}" width="{ow}" height="{oh}" viewBox="0 0 {ow} {oh}">{other}</svg>
          </svg>'''

          with open("banner-desktop.svg", "w", encoding="utf-8") as f:
              f.write(desktop)
          with open("banner-mobile.svg", "w", encoding="utf-8") as f:
              f.write(mobile)

          print(f"desktop: {desktop_w}x{desktop_h}")
          print(f"mobile:  {mobile_w}x{mobile_h}")
          print("done")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner-desktop.svg banner-mobile.svg
          git diff --staged --quiet && echo "no changes" || git commit -m "chore: update banner svgs - [Skip GitHub Action]"
          git push
       
